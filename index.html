    <!--
      AdFox / РСЯ: загрузчик ставится один раз и обслуживает все блоки.
      Грузим его только на боевом хосте: на localhost/превью/IP реклама не
      запрашивается, чтобы тестовые открытия не уходили в статистику AdFox
      (и не считались невалидным трафиком). Проверить локально: ?ads=1
    -->
    <script>
      window.yaContextCb = window.yaContextCb || [];
      (function () {
        var force = /[?&]ads=1(&|#|$)/.test(location.search);
        var host = location.hostname;
        var isNonProduction =
          location.protocol === 'file:' ||
          host === 'localhost' ||
          host === '::1' ||
          host === '[::1]' ||
          /^(127|10)\./.test(host) ||
          /^192\.168\./.test(host) ||
          /^172\.(1[6-9]|2\d|3[01])\./.test(host) ||
          /\.(local|localhost|test|invalid)$/.test(host);

        if (isNonProduction && !force) return;

        window.__adsEnabled = true;
        var script = document.createElement('script');
        script.src = 'https://yandex.ru/ads/system/context.js';
        script.async = true;
        document.head.appendChild(script);
      })();
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme') || 'auto';
          var isDark =
            stored === 'dark' ||
            (stored === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var resolved = isDark ? 'dark' : 'light';
          var resolvedColor = isDark ? '#0f1216' : '#f2f5fb';

          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;

          var meta = document.getElementById('dynamic-theme-color');
          if (meta) {
            meta.setAttribute('content', resolvedColor);
